name: Paris v2.4.3 Retro 2016

on:
  push:
    branches: [main]
    paths:
      - 'run_retro_2016_v243.py'
      - '.github/workflows/paris_v243_retro_2016.yml'
  workflow_dispatch:

jobs:
  retro2016:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download 2012-2018 NFLverse player stats
        run: |
          mkdir -p data/player_stats
          for year in $(seq 2012 2018); do
            curl -L --fail --retry 3 https://github.com/nflverse/nflverse-data/releases/download/player_stats/player_stats_${year}.csv -o data/player_stats/player_stats_${year}.csv
          done

      - name: Download players
        run: |
          mkdir -p data
          curl -L --fail --retry 3 https://github.com/nflverse/nflverse-data/releases/download/players/players.csv -o data/players.csv

      - name: Download 2012-2018 weekly rosters
        run: |
          mkdir -p data/weekly_rosters
          for year in $(seq 2012 2018); do
            curl -L --fail --retry 3 https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_${year}.parquet -o data/weekly_rosters/roster_weekly_${year}.parquet
          done

      - name: Download 2016 depth chart
        run: |
          mkdir -p data/depth_charts
          curl -L --fail --retry 3 https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_2016.parquet -o data/depth_charts/depth_charts_2016.parquet

      - name: Download 2012-2018 play-by-play
        run: |
          mkdir -p data/pbp
          for year in $(seq 2012 2018); do
            curl -L --fail --retry 3 https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${year}.parquet -o data/pbp/play_by_play_${year}.parquet
          done

      - name: Run core tests
        run: pytest -q

      - name: Run frozen 2016 robustness test
        run: |
          mkdir -p outputs_retro_2016
          python run_retro_2016_v243.py \
            --data-dir data/player_stats \
            --players-csv data/players.csv \
            --roster-dir data/weekly_rosters \
            --depth-dir data/depth_charts \
            --pbp-dir data/pbp \
            --out-dir outputs_retro_2016 | tee outputs_retro_2016/run_report.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-v243-retro-2016
          path: outputs_retro_2016/
          retention-days: 30
