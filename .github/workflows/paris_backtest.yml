name: Inspect Rookie Sources

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download rookie source data
        run: |
          mkdir -p data
          curl -L --fail --retry 3 https://github.com/nflverse/nflverse-data/releases/download/players/players.csv -o data/players.csv
          curl -L --fail --retry 3 https://github.com/nflverse/nflverse-data/releases/download/draft_picks/draft_picks.parquet -o data/draft_picks.parquet
          curl -L --fail --retry 3 https://github.com/nflverse/nflverse-data/releases/download/combine/combine.parquet -o data/combine.parquet
      - name: Inspect schemas
        run: python inspect_rookie_sources.py --players data/players.csv --draft data/draft_picks.parquet --combine data/combine.parquet
