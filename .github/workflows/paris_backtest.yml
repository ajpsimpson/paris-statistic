name: Paris v2.2.1 Veteran Stress Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download 2015-2023 NFLverse player stats
        run: python download_nflverse_data.py

      - name: Download NFLverse player metadata and current historical-contract parquet
        run: |
          mkdir -p data
          curl -L --fail --retry 3 \
            https://github.com/nflverse/nflverse-data/releases/download/players/players.csv \
            -o data/players.csv
          curl -L --fail --retry 3 \
            https://github.com/nflverse/nflverse-data/releases/download/contracts/historical_contracts.parquet \
            -o data/historical_contracts.parquet

      - name: Run Paris core unit tests
        run: pytest -q

      - name: Run Paris v2.2.1 veteran role-survival stress test
        run: |
          mkdir -p outputs_v221p
          python run_stress_v221_current_contracts.py \
            --data-dir data/player_stats \
            --players-csv data/players.csv \
            --contracts-parquet data/historical_contracts.parquet \
            --out-dir outputs_v221p | tee outputs_v221p/run_report.txt

      - name: Upload v2.2.1 stress-test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-v221-current-contract-stress-results
          path: outputs_v221p/
          retention-days: 30
