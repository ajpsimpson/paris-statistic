name: Paris v2.2.3 Preseason Depth Role Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download 2015-2023 NFLverse player stats
        run: python download_nflverse_data.py

      - name: Download NFLverse player metadata
        run: |
          mkdir -p data
          curl -L --fail --retry 3 \
            https://github.com/nflverse/nflverse-data/releases/download/players/players.csv \
            -o data/players.csv

      - name: Download 2019-2023 Week-level roster files only
        run: |
          mkdir -p data/weekly_rosters
          for year in 2019 2020 2021 2022 2023; do
            curl -L --fail --retry 3 \
              https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_${year}.parquet \
              -o data/weekly_rosters/roster_weekly_${year}.parquet
          done

      - name: Download 2016-2023 historical depth charts only
        run: |
          mkdir -p data/depth_charts
          for year in 2016 2017 2018 2019 2020 2021 2022 2023; do
            curl -L --fail --retry 3 \
              https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_${year}.parquet \
              -o data/depth_charts/depth_charts_${year}.parquet
          done

      - name: Run Paris core unit tests
        run: pytest -q

      - name: Run Paris v2.2.3 preseason-depth test
        run: |
          mkdir -p outputs_v223
          python run_backtest_v223.py \
            --data-dir data/player_stats \
            --players-csv data/players.csv \
            --roster-dir data/weekly_rosters \
            --depth-dir data/depth_charts \
            --out-dir outputs_v223 | tee outputs_v223/run_report.txt

      - name: Upload v2.2.3 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-v223-preseason-depth-results
          path: outputs_v223/
          retention-days: 30
