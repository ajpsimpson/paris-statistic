name: Paris v2.1 Historical Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download 2015-2023 NFLverse player stats
        run: python download_nflverse_data.py

      - name: Download NFLverse player metadata
        run: |
          mkdir -p data
          curl -L --fail --retry 3 \
            https://github.com/nflverse/nflverse-data/releases/download/players/players.csv \
            -o data/players.csv

      - name: Run Paris core unit tests
        run: pytest -q

      - name: Run Paris v2.1 2019-2023 rolling backtest
        run: |
          mkdir -p outputs_v21
          python run_backtest_v21.py \
            --data-dir data/player_stats \
            --players-csv data/players.csv \
            --out-dir outputs_v21 | tee outputs_v21/run_report.txt

      - name: Upload v2.1 backtest outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-v21-backtest-results
          path: outputs_v21/
          retention-days: 30
