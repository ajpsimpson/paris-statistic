name: Paris v2.2.2 Preseason Roster Filter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download 2015-2023 NFLverse player stats
        run: python download_nflverse_data.py

      - name: Download NFLverse player metadata
        run: |
          mkdir -p data/weekly_rosters
          curl -L --fail --retry 3 \
            https://github.com/nflverse/nflverse-data/releases/download/players/players.csv \
            -o data/players.csv

      - name: Download 2019-2023 NFLverse weekly rosters
        run: |
          for y in 2019 2020 2021 2022 2023; do
            curl -L --fail --retry 3 \
              https://github.com/nflverse/nflverse-data/releases/download/weekly_rosters/roster_weekly_${y}.parquet \
              -o data/weekly_rosters/roster_weekly_${y}.parquet
          done

      - name: Run Paris core unit tests
        run: pytest -q

      - name: Run Paris v2.2.2 roster-filter backtest
        run: |
          mkdir -p outputs_v222
          python run_backtest_v222_rosters.py \
            --data-dir data/player_stats \
            --players-csv data/players.csv \
            --roster-dir data/weekly_rosters \
            --out-dir outputs_v222 | tee outputs_v222/run_report.txt

      - name: Upload v2.2.2 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paris-v222-roster-filter-results
          path: outputs_v222/
          retention-days: 30
